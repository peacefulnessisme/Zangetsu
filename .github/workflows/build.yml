name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip project files
      run: |
        unzip -o Zangetsu-1.9.8.zip
        if [ -d "Zangetsu-1.9.8" ]; then
          cp -r Zangetsu-1.9.8/* .
        fi

    - name: Fix pubspec.yaml duplicate file_picker
      run: |
        python3 -c "
        with open('pubspec.yaml', 'r') as f:
            lines = f.readlines()
        seen = False
        new_lines = []
        for line in lines:
            if 'file_picker:' in line:
                if not seen:
                    seen = True
                    new_lines.append(line)
            else:
                new_lines.append(line)
        with open('pubspec.yaml', 'w') as f:
            f.writelines(new_lines)
        "

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
